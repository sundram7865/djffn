[project]
name = "wind-forecast-backend"
version = "1.0.0"
description = "Point-in-time wind forecast selection and accuracy analytics for GB day-ahead buying"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "error::FutureWarning",
  # starlette nudges towards httpx2 for TestClient; httpx works and is what FastAPI documents.
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "NPY", "PD"]
ignore = [
  "PLR0913", # analysis functions legitimately take several parameters
  "PLR2004", # domain constants in tests read better inline
  "E501",    # the formatter owns line length; long user-facing strings are fine
  "RUF001",  # en-dashes and ≥ in user-facing labels are intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["app"]
omit = ["app/elexon/*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true # pandas is checked as Any (pandas-stubs overloads add noise, not safety)
check_untyped_defs = true
warn_unused_ignores = true
