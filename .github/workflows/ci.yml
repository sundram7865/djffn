name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy app
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing
      - name: Vercel requirements match backend runtime requirements
        working-directory: .
        run: |
          diff <(grep -v -e '^#' -e '^uvicorn' backend/requirements.txt | sort) \
               <(grep -v '^#' requirements.txt | sort)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t winddesk:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 winddesk:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          curl -fsS "localhost:8000/api/forecast?date=2026-01-15" | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['points'])==24"
          curl -fsS localhost:8000/ | grep -q '<div id="root">'
          docker logs app
